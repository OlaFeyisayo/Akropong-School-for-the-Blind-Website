<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager · Akropong School for the Blind</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Netlify Identity: handles admin login when using the git-gateway backend. -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!--
      This is the admin panel for editing website content.
      It uses Decap CMS (https://decapcms.org). Content is defined in config.yml.

      To switch to Sveltia CMS (a modern drop-in alternative that works well
      with the GitHub backend), replace the Decap <script> tag below with:
        <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
      Sveltia reads the same config.yml, so nothing else needs to change.
    -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
