# ============================================================================
# Admin panel configuration (Decap CMS / Sveltia CMS)
# This controls what the school can edit at  yoursite/admin/
# Content is saved straight back into this GitHub repo, which triggers a
# fresh deploy on Netlify. Non-technical editors never touch code.
# ============================================================================

backend:
  name: git-gateway
  branch: main

# Allow local editing with `npx decap-server` during development.
local_backend: true

media_folder: "public/uploads"
public_folder: "/uploads"

locale: en

# Shown at the top of the admin to guide editors.
site_url: /
display_url: /
logo_url: /favicon.svg

collections:
  # ------------------------------------------------------------------ Settings
  - name: settings
    label: "Site settings & contact"
    delete: false
    editor:
      preview: false
    files:
      - name: general
        label: "General, contact & donations"
        file: "src/data/settings.json"
        fields:
          - { name: orgName, label: "School name", widget: string }
          - { name: tagline_en, label: "Tagline (English)", widget: string }
          - { name: tagline_fr, label: "Tagline (Français)", widget: string }
          - { name: logo, label: "Logo", widget: image, required: false, hint: "Optional. Leave empty to use the default mark." }
          - { name: email, label: "Email", widget: string, required: false }
          - { name: phone, label: "Phone", widget: string, required: false }
          - { name: whatsapp, label: "WhatsApp number", widget: string, required: false }
          - { name: address_en, label: "Address (English)", widget: string, required: false }
          - { name: address_fr, label: "Address (Français)", widget: string, required: false }
          - { name: mapEmbedUrl, label: "Map embed URL", widget: string, required: false, hint: "An embeddable map link (e.g. from OpenStreetMap or Google Maps)." }
          - { name: facebook, label: "Facebook URL", widget: string, required: false }
          - { name: instagram, label: "Instagram URL", widget: string, required: false }
          - { name: youtube, label: "YouTube URL", widget: string, required: false }
          - { name: x, label: "X (Twitter) URL", widget: string, required: false }
          - { name: linkedin, label: "LinkedIn URL", widget: string, required: false }
          - { name: donateUrl, label: "Online donation link", widget: string, required: false, hint: "A link to a donation platform (PayPal, GoFundMe, etc.)." }
          - { name: momoNumber, label: "Mobile Money number", widget: string, required: false }
          - { name: momoName, label: "Mobile Money account name", widget: string, required: false }
          - { name: bankName, label: "Bank name", widget: string, required: false }
          - { name: bankAccountName, label: "Bank account name", widget: string, required: false }
          - { name: bankAccountNumber, label: "Bank account number", widget: string, required: false }
          - { name: bankBranch, label: "Bank branch", widget: string, required: false }
          - { name: bankSwift, label: "SWIFT / BIC", widget: string, required: false }

  # --------------------------------------------------------------------- Pages
  - name: pages
    label: "Pages"
    delete: false
    editor:
      preview: false
    files:
      # ---- Home
      - name: home
        label: "Home page"
        file: "src/data/pages/home.json"
        fields:
          - { name: heroTitle_en, label: "Hero title (EN)", widget: string }
          - { name: heroTitle_fr, label: "Hero title (FR)", widget: string }
          - { name: heroSubtitle_en, label: "Hero subtitle (EN)", widget: text }
          - { name: heroSubtitle_fr, label: "Hero subtitle (FR)", widget: text }
          - { name: heroImage, label: "Hero image", widget: image, required: false }
          - { name: heroImageAlt_en, label: "Hero image description (EN)", widget: string, required: false }
          - { name: heroImageAlt_fr, label: "Hero image description (FR)", widget: string, required: false }
          - name: stats
            label: "Statistics"
            widget: list
            required: false
            fields:
              - { name: value, label: "Number", widget: string }
              - { name: label_en, label: "Label (EN)", widget: string }
              - { name: label_fr, label: "Label (FR)", widget: string }
          - { name: introEyebrow_en, label: "Intro eyebrow (EN)", widget: string, required: false }
          - { name: introEyebrow_fr, label: "Intro eyebrow (FR)", widget: string, required: false }
          - { name: introTitle_en, label: "Intro title (EN)", widget: string }
          - { name: introTitle_fr, label: "Intro title (FR)", widget: string }
          - { name: introText_en, label: "Intro text (EN)", widget: text }
          - { name: introText_fr, label: "Intro text (FR)", widget: text }
          - { name: highlightsTitle_en, label: "Highlights title (EN)", widget: string }
          - { name: highlightsTitle_fr, label: "Highlights title (FR)", widget: string }
          - name: highlights
            label: "Highlights"
            widget: list
            required: false
            fields:
              - { name: icon, label: "Icon", widget: select, options: [book, heart, tools, music, sports, tech, gift, eye] }
              - { name: title_en, label: "Title (EN)", widget: string }
              - { name: title_fr, label: "Title (FR)", widget: string }
              - { name: text_en, label: "Text (EN)", widget: text }
              - { name: text_fr, label: "Text (FR)", widget: text }
          - { name: ctaTitle_en, label: "Call-to-action title (EN)", widget: string }
          - { name: ctaTitle_fr, label: "Call-to-action title (FR)", widget: string }
          - { name: ctaText_en, label: "Call-to-action text (EN)", widget: text }
          - { name: ctaText_fr, label: "Call-to-action text (FR)", widget: text }
          - { name: ctaImage, label: "Call-to-action image", widget: image, required: false }
          - { name: ctaImageAlt_en, label: "CTA image description (EN)", widget: string, required: false }
          - { name: ctaImageAlt_fr, label: "CTA image description (FR)", widget: string, required: false }

      # ---- About
      - name: about
        label: "About page"
        file: "src/data/pages/about.json"
        fields:
          - { name: title_en, label: "Title (EN)", widget: string }
          - { name: title_fr, label: "Title (FR)", widget: string }
          - { name: intro_en, label: "Intro (EN)", widget: text }
          - { name: intro_fr, label: "Intro (FR)", widget: text }
          - { name: heroImage, label: "Image", widget: image, required: false }
          - { name: heroImageAlt_en, label: "Image description (EN)", widget: string, required: false }
          - { name: heroImageAlt_fr, label: "Image description (FR)", widget: string, required: false }
          - { name: storyTitle_en, label: "Story title (EN)", widget: string }
          - { name: storyTitle_fr, label: "Story title (FR)", widget: string }
          - { name: storyBody_en, label: "Story (EN)", widget: markdown }
          - { name: storyBody_fr, label: "Story (FR)", widget: markdown }
          - { name: missionTitle_en, label: "Mission title (EN)", widget: string }
          - { name: missionTitle_fr, label: "Mission title (FR)", widget: string }
          - { name: missionBody_en, label: "Mission (EN)", widget: text }
          - { name: missionBody_fr, label: "Mission (FR)", widget: text }
          - { name: visionTitle_en, label: "Vision title (EN)", widget: string }
          - { name: visionTitle_fr, label: "Vision title (FR)", widget: string }
          - { name: visionBody_en, label: "Vision (EN)", widget: text }
          - { name: visionBody_fr, label: "Vision (FR)", widget: text }
          - name: values
            label: "Values"
            widget: list
            required: false
            fields:
              - { name: title_en, label: "Title (EN)", widget: string }
              - { name: title_fr, label: "Title (FR)", widget: string }
              - { name: text_en, label: "Text (EN)", widget: text }
              - { name: text_fr, label: "Text (FR)", widget: text }

      # ---- Programs
      - name: programs
        label: "Programs page"
        file: "src/data/pages/programs.json"
        fields:
          - { name: title_en, label: "Title (EN)", widget: string }
          - { name: title_fr, label: "Title (FR)", widget: string }
          - { name: intro_en, label: "Intro (EN)", widget: text }
          - { name: intro_fr, label: "Intro (FR)", widget: text }
          - name: programs
            label: "Programs"
            widget: list
            fields:
              - { name: icon, label: "Icon", widget: select, options: [book, heart, tools, music, sports, tech, gift, eye] }
              - { name: title_en, label: "Title (EN)", widget: string }
              - { name: title_fr, label: "Title (FR)", widget: string }
              - { name: text_en, label: "Text (EN)", widget: text }
              - { name: text_fr, label: "Text (FR)", widget: text }

      # ---- Donate
      - name: donate
        label: "Donate page"
        file: "src/data/pages/donate.json"
        fields:
          - { name: title_en, label: "Title (EN)", widget: string }
          - { name: title_fr, label: "Title (FR)", widget: string }
          - { name: intro_en, label: "Intro (EN)", widget: text }
          - { name: intro_fr, label: "Intro (FR)", widget: text }
          - { name: heroImage, label: "Image", widget: image, required: false }
          - { name: heroImageAlt_en, label: "Image description (EN)", widget: string, required: false }
          - { name: heroImageAlt_fr, label: "Image description (FR)", widget: string, required: false }
          - name: impact
            label: "Impact examples"
            widget: list
            required: false
            fields:
              - { name: amount_en, label: "Amount (EN)", widget: string }
              - { name: amount_fr, label: "Amount (FR)", widget: string }
              - { name: text_en, label: "Text (EN)", widget: text }
              - { name: text_fr, label: "Text (FR)", widget: text }
          - { name: waysTitle_en, label: "Other ways title (EN)", widget: string }
          - { name: waysTitle_fr, label: "Other ways title (FR)", widget: string }
          - { name: waysBody_en, label: "Other ways text (EN)", widget: markdown }
          - { name: waysBody_fr, label: "Other ways text (FR)", widget: markdown }
          - { name: note_en, label: "Note (EN)", widget: string, required: false }
          - { name: note_fr, label: "Note (FR)", widget: string, required: false }

      # ---- Admissions
      - name: admissions
        label: "Admissions page"
        file: "src/data/pages/admissions.json"
        fields:
          - { name: title_en, label: "Title (EN)", widget: string }
          - { name: title_fr, label: "Title (FR)", widget: string }
          - { name: intro_en, label: "Intro (EN)", widget: text }
          - { name: intro_fr, label: "Intro (FR)", widget: text }
          - { name: heroImage, label: "Image", widget: image, required: false }
          - { name: heroImageAlt_en, label: "Image description (EN)", widget: string, required: false }
          - { name: heroImageAlt_fr, label: "Image description (FR)", widget: string, required: false }
          - { name: stepsTitle_en, label: "Steps title (EN)", widget: string }
          - { name: stepsTitle_fr, label: "Steps title (FR)", widget: string }
          - name: steps
            label: "Steps"
            widget: list
            fields:
              - { name: title_en, label: "Title (EN)", widget: string }
              - { name: title_fr, label: "Title (FR)", widget: string }
              - { name: text_en, label: "Text (EN)", widget: text }
              - { name: text_fr, label: "Text (FR)", widget: text }
          - { name: requirementsTitle_en, label: "Requirements title (EN)", widget: string }
          - { name: requirementsTitle_fr, label: "Requirements title (FR)", widget: string }
          - name: requirements
            label: "Requirements"
            widget: list
            fields:
              - { name: text_en, label: "Text (EN)", widget: string }
              - { name: text_fr, label: "Text (FR)", widget: string }
          - { name: note_en, label: "Note (EN)", widget: text, required: false }
          - { name: note_fr, label: "Note (FR)", widget: text, required: false }

      # ---- Contact
      - name: contact
        label: "Contact page"
        file: "src/data/pages/contact.json"
        fields:
          - { name: title_en, label: "Title (EN)", widget: string }
          - { name: title_fr, label: "Title (FR)", widget: string }
          - { name: intro_en, label: "Intro (EN)", widget: text }
          - { name: intro_fr, label: "Intro (FR)", widget: text }
          - { name: hoursTitle_en, label: "Hours title (EN)", widget: string, required: false }
          - { name: hoursTitle_fr, label: "Hours title (FR)", widget: string, required: false }
          - { name: hoursBody_en, label: "Hours text (EN)", widget: text, required: false }
          - { name: hoursBody_fr, label: "Hours text (FR)", widget: text, required: false }

  # ---------------------------------------------------------------------- News
  - name: news
    label: "News & stories"
    label_singular: "Article"
    folder: "src/data/news"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{title_en}} — {{date}}"
    sortable_fields: [date, title_en]
    fields:
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: image, label: "Image", widget: image, required: false }
      - { name: imageAlt_en, label: "Image description (EN)", widget: string, required: false }
      - { name: imageAlt_fr, label: "Image description (FR)", widget: string, required: false }
      - { name: title_en, label: "Title (EN)", widget: string }
      - { name: title_fr, label: "Title (FR)", widget: string }
      - { name: summary_en, label: "Summary (EN)", widget: text }
      - { name: summary_fr, label: "Summary (FR)", widget: text }
      - { name: body_en, label: "Article (EN)", widget: markdown }
      - { name: body_fr, label: "Article (FR)", widget: markdown }
